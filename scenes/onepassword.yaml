# yaml-language-server: $schema=../schema/scene.schema.json
# 解説動画: 1Passwordってなに？
#
# 生成: npm run video -- scenes/onepassword.yaml
# サムネ: npm run thumbnail -- scenes/onepassword.yaml

title: "1Passwordってなに？"
character: zundamon
speaker_id: 3
fps: 30
width: 1920
height: 1080
defaultBackground: "gradient"
defaultPause: 0.4
defaultSubtitle: boxed
defaultSlideVariant: card

defaultSe:
  src: "audio/se/pop.ogg"
  volume: 0.20

dict:
  1Password: ワンパスワード
  Password: パスワード
  AgileBits: アジャイルビッツ
  マスターパスワード: マスターパスワード
  パスキー: パスキー

bgm:
  src: "audio/bgm/carefree-kevin-macleod.mp3"
  volume: 0.10
  fadeIn: 1.5
  fadeOut: 2.5
  credit: "BGM: Carefree - Kevin MacLeod (incompetech.com) / CC BY 4.0"

opening:
  variant: band
  title: "1Passwordってなに？"
  subtitle: "パスワード管理のしくみ"
  badge: "解説"
  accent: "#0364d3"
  background: "dark"
  emotion: happy
  se: "audio/se/transition.ogg"
  text: "ずんだもんなのだ！今日はパスワード管理の話をするのだ！"

thumbnail:
  variant: bold
  title: "1Passwordってなに？"
  subtitle: "パスワードを安全に管理"
  badge: "解説"
  accent: "#0364d3"
  background: "dark"
  emotion: smug

scenes:
  # ---- 導入 ----
  - text: "みんな、パスワードってどうやって覚えているのだ？"
    emotion: thinking

  - text: "サービスごとに違うパスワードにすると、すぐ覚えきれなくなるのだ"
    emotion: sad
    pause: 0.6

  - text: "そこで役に立つのが、1Passwordというツールなのだ"
    emotion: happy
    pause: 0.6

  # ---- スライド1: 1Passwordとは ----
  - text: "1Passwordがどんなものか、まとめてみたのだ"
    emotion: normal
    background: purple
    slide:
      se: "audio/se/slide-in.ogg"
      title: "1Passwordとは"
      accent: "#0364d3"
      bullets:
        - "パスワードをまとめて保管する金庫"
        - "覚えるのはマスターパスワード1つだけ"
        - "パソコンでもスマホでも使える"
      note: "カナダのAgileBits社が作っている"

  - text: "ひとことで言うと、パスワードをまとめて入れておく金庫なのだ"
    se: "audio/se/select.ogg"
    emotion: normal
    background: purple
    highlight: 1

  - text: "自分が覚えるのは、金庫を開けるためのマスターパスワード1つだけなのだ"
    se: "audio/se/select.ogg"
    emotion: happy
    background: purple
    highlight: 2

  - text: "パソコンでもスマホでも、同じ金庫を開けて使えるのだ"
    se: "audio/se/select.ogg"
    emotion: smug
    background: purple
    highlight: 3

  # ---- スライド2: 何がうれしいか ----
  - text: "使うと、どんないいことがあるのだ？"
    emotion: thinking
    background: blue
    slide:
      se: "audio/se/slide-in.ogg"
      title: "うれしいところ"
      accent: "#0984e3"
      bullets:
        - "強いパスワードを自動で作ってくれる"
        - "ログイン画面で自動で入力してくれる"
        - "漏れたパスワードを教えてくれる"
      note: "だから使い回しをやめられる"

  - text: "推測されにくい強いパスワードを、自動で作ってくれるのだ"
    se: "audio/se/select.ogg"
    emotion: normal
    background: blue
    highlight: 1

  - text: "ログイン画面では、自動で入力してくれるから手打ちがいらないのだ"
    se: "audio/se/select.ogg"
    emotion: happy
    background: blue
    highlight: 2

  - text: "もし漏れてしまったパスワードがあれば、それも教えてくれるのだ"
    se: "audio/se/chime.ogg"
    emotion: surprised
    background: blue
    highlight: 3

  # ---- スライド3: 安全のしくみ ----
  - text: "でも、全部あずけて安全なのだ？"
    emotion: thinking
    background: green
    slide:
      variant: fullbleed
      se: "audio/se/slide-in.ogg"
      title: "安全のしくみ"
      accent: "#00b894"
      bullets:
        - "中身は自分の端末で暗号化される"
        - "会社のサーバーにも中身は見えない"
        - "鍵になるのはマスターパスワード"

  - text: "保管する中身は、自分の端末の中で暗号化されるのだ"
    se: "audio/se/select.ogg"
    emotion: normal
    background: green
    highlight: 1

  - text: "だから、1Passwordの会社のサーバーにも中身は見えないのだ"
    se: "audio/se/select.ogg"
    emotion: happy
    background: green
    highlight: 2

  - text: "その鍵になるのがマスターパスワードだから、これだけは大事に守るのだ"
    se: "audio/se/select.ogg"
    emotion: smug
    background: green
    highlight: 3

  # ---- パスキー ----
  - text: "最近は、パスキーという新しいしくみにも対応しているのだ"
    emotion: happy
    background: orange
    slide:
      variant: title
      se: "audio/se/transition.ogg"
      title: "パスキーにも対応"
      note: "パスワードを打たずに、より安全にログインできる新しいしくみ"
      accent: "#e17055"

  - text: "パスキーは、パスワードを打たずにログインできる新しいしくみなのだ"
    emotion: normal
    background: orange

  - text: "1Passwordがそれもまとめて管理してくれるのだ"
    emotion: happy
    background: orange
    pause: 0.6

  # ---- 注意点 ----
  - text: "ひとつ注意なのだ。1Passwordは基本、有料のサービスなのだ"
    emotion: normal
    background: dark

  - text: "無料でお試しはできるけど、続けて使うなら料金がかかるのだ"
    emotion: tired
    background: dark
    pause: 0.6

  # ---- まとめ ----
  - text: "というわけで、1Passwordはパスワードを安全にまとめる金庫なのだ！"
    se: "audio/se/confirm.ogg"
    emotion: happy
    background: gradient
    slide: null

  - text: "使い回しをやめる第一歩に、ぜひ試してみてほしいのだ！"
    emotion: happy
    pause: 1.0

ending:
  variant: band
  title: "ご視聴ありがとうございました"
  subtitle: "また次の動画で"
  accent: "#0364d3"
  background: "dark"
  emotion: happy
  se: "audio/se/confirm.ogg"
  text: "最後まで見てくれてありがとうなのだ！また次の動画で会おうなのだ！"
